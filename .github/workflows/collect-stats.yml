name: collect-stats
# Every 10 minutes, pull anonymous usage messages from ntfy.sh into data.csv on the "data" branch.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-stats
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Check out the data branch (create it if missing)
        run: |
          git clone --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          cd data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git checkout --quiet data
          else
            git checkout --quiet --orphan data && git rm -rf --quiet . || true
            printf '# Usage data\n\ndata.csv holds anonymous usage rows from the OSH Mock Test app, updated every 10 minutes by the collect-stats workflow.\n' > README.md
          fi
      - name: Collect
        run: python3 app/.github/scripts/collect_stats.py data
      - name: Commit
        run: |
          cd data
          git config user.name "osh-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit --quiet -m "Update usage data"
          git push --quiet origin data
